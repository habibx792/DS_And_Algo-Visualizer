<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DSA Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navyDeep: "#0b092d",
                        navySoft: "#20213b",
                        navyDark: "#0d1120",
                        goldAccent: "#fca311",
                    }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-b from-navyDeep via-navySoft to-navyDark text-white">

    <script>
        // Redirect if already logged in
        if (localStorage.getItem('dsaLoggedIn') === 'true') {
            window.location.href = '/main';
        }
    </script>

    <div class="animate-fade-in bg-navySoft/80 border border-goldAccent/30 backdrop-blur-xl p-8 rounded-2xl w-11/12 max-w-md shadow-2xl">
        <h1 class="text-3xl font-bold text-center text-goldAccent mb-2">Welcome Back</h1>
        <p class="text-gray-400 text-center mb-6">Sign in to continue</p>

        <div id="message" class="mb-4 hidden p-3 rounded"></div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm text-gray-300 mb-1">Email</label>
                <input id="email" type="email" required
                       class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white focus:ring-2 focus:ring-goldAccent outline-none"
                       placeholder="you@example.com">
            </div>

            <div class="relative">
                <label class="block text-sm text-gray-300 mb-1">Password</label>
                <input id="password" type="password" required
                       class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white focus:ring-2 focus:ring-goldAccent outline-none"
                       placeholder="••••••••">
                <button type="button" id="togglePassword" class="absolute right-3 top-8 text-gray-400">
                    <i class="fa-solid fa-eye"></i>
                </button>

                <div class="text-right mt-2">
                    <a href="passforget.html" class="text-goldAccent text-sm hover:underline">
                        Forgot Password?
                    </a>
                </div>
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full bg-goldAccent hover:bg-white text-navyDark font-semibold py-2 rounded-lg transition duration-300">
                Sign In
            </button>

            <p class="text-center text-gray-400 text-sm">
                Don't have an account?
                <a href="/signup" class="text-goldAccent hover:underline font-medium">
                    Sign Up
                </a>
            </p>
        </form>
    </div>

   
    <script src="../JS/login.js"></script>
</body>
</html>
